research_task:
  description: >
    Today's date is {current_date}. Conduct a thorough research about current
    stock market status as of today. Include the current month and year in your
    searches so results are recent, and ignore news older than a few weeks
    unless it is still driving the market.
  expected_output: >
    A list with 10 bullet points of the most relevant information about potential high yield stocks
  agent: researcher

reporting_task:
  description: >
    Today's date is {current_date}. Review the context you got and expand each
    topic into a full section for a report dated {current_date}.
    Make sure the report is detailed and contains any and all relevant information.
  expected_output: >
    A fully fledged report with the main topics, each with a full section of information.
    Formatted as markdown without '```'
  agent: reporting_analyst
